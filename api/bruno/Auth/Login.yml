info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  auth:
    type: none
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{userEmail}}",
        "password": "{{userPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Same token-capture as Register: store the JWT so downstream requests
        // authenticate automatically. Run this once, then call Get Progress.
        if (res.status === 200) {
          bru.setEnvVar("token", res.body.token);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.token_type
      operator: eq
      value: Bearer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Log in an existing user. 200 issues a JWT, 400 on malformed request, 401 on
  invalid credentials. Public endpoint (no auth).
