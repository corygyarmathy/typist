info:
  name: Liveness
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/healthz"
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: ok

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Liveness probe. Always 200 while the process is serving; does not touch the
  database. Public endpoint (no auth).
