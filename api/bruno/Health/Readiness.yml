info:
  name: Readiness
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/readyz"
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Readiness probe. 200 when the database is reachable within 2s, otherwise 503
  with an application/problem+json body. Public endpoint (no auth).
