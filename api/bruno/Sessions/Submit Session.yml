info:
  name: Submit Session
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/sessions"
  auth:
    type: bearer
    token: "{{token}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "keys": {
          "e": { "attempts": 24, "errors": 1, "total_millis": 7200 },
          "t": { "attempts": 21, "errors": 0, "total_millis": 6300 },
          "a": { "attempts": 18, "errors": 2, "total_millis": 5400 },
          "o": { "attempts": 15, "errors": 0, "total_millis": 4500 }
        },
        "ngrams": {
          "te": { "attempts": 6, "errors": 0, "total_millis": 3600 },
          "at": { "attempts": 4, "errors": 1, "total_millis": 2400 }
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.wpm
      operator: eq
      value: "40"
    - expression: res.body.accuracy
      operator: isDefined
    - expression: res.body.id
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Submit a completed lesson. 201 with the session summary, 400 on a malformed
  body, 401 if unauthenticated.

  The client submits OBSERVATIONS ONLY. There is no wpm, accuracy or duration
  field to send - the server derives all of them from the numbers below, so the
  figure the session row reports and the figure the engine scored against come
  from the same input and cannot disagree.

  ## Why these numbers

  The body is arithmetically rigged so the response is checkable by hand. Over
  the four keys: 78 attempts, 3 errors, 23400 ms - a steady 300 ms per
  keystroke.

      accuracy = 1 - 3/78                    = 0.9615...
      wpm      = (78/5) / (23400/60000)      = 40 exactly

  So `wpm eq 40` is not a smoke test. Sum the ngram side in as well - 88
  attempts over 29400 ms - and it comes out 35. That is the double-count trap
  from decision 2 of docs/plans/phase-4-sessions.md: a bigram's total_millis
  covers two keystrokes and a middle character sits in two bigram windows. This
  request fails loudly if that bug ever ships.

  ngram observations are still SCORED, just never summed into the summary.

  ## Things worth trying by hand

  - Add a key the user has not unlocked ("z"). You still get a 201 and no
    competency change for it - the client must not be able to expand its own
    unlock set by submitting. Silent by design; see decision 3.
  - Set an "errors" higher than its "attempts", or "total_millis" to 0. That is
    a 400 problem+json, because it is a client bug rather than a scope question.
  - Send a two-character key ("th") under "keys". Also a 400 - it belongs under
    ngrams, and without the check it would join the unlock set as a key the
    user never earned.
  - Run it twice, then send List Sessions to see both rows.

  Call Get Progress afterwards to watch samples climb; the response here
  deliberately carries the session summary only (decision 8).

  ASSERTS 201, WHICH IS RED UNTIL step 5 of docs/plans/phase-4-sessions.md
  lands. Until then the route is stubbed and answers 501 problem+json.
