name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: typing
          POSTGRES_PASSWORD: typing
          POSTGRES_DB: typing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          DATABASE_URL: postgres://typing:typing@localhost:5432/typing?sslmode=disable
        run: go test -race -cover ./...

      - name: build
        run: go build ./...

  dev-shell:
    # Validate the Nix dev shell so flake.lock / flake.nix changes (including the
    # weekly Dependabot bumps) are exercised through the Nix path. Dependabot PRs
    # trigger this automatically, so it is the validation gate for those bumps.
    # Grows naturally once `nix build` / the NixOS module lands (ADR-0006).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build and lint inside the dev shell
        run: |
          nix develop -c bash -c 'set -e; go version; go vet ./...; go build ./...; golangci-lint run ./...'

  codegen:
    # Enforce the reproducibility claim in ADR-0021: the committed
    # internal/openapi/openapi.gen.go must match what the pinned generator
    # produces from the committed api/openapi.yaml. Regenerating through
    # `nix develop` uses the flake-pinned oapi-codegen (ADR-0017), so a
    # non-empty diff means the generated file is stale or was hand-edited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Verify generated code is in sync with the spec
        run: |
          nix develop -c bash -c 'set -e; make openapi; git diff --exit-code internal/openapi/openapi.gen.go'

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build Docker image
        run: docker build -f deploy/docker/Dockerfile -t typist:${{ github.sha }} .
