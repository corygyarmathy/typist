name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: every job here only reads the repo (checkout,
# git diff, builds). No job pushes commits, packages, or PR comments, so the
# workflow default is read-only. Escalate per-job if that ever changes.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # The setup-go toolchain below is the only one this job may use: a go.mod
    # that outruns it should fail here, not silently download a second Go whose
    # version no longer matches what setup-go cached and reported.
    env:
      GOTOOLCHAIN: local
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: typing
          POSTGRES_PASSWORD: typing
          POSTGRES_DB: typing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          DATABASE_URL: postgres://typing:typing@localhost:5432/typing?sslmode=disable
        run: go test -race -cover ./...

      - name: build
        run: go build ./...

  dev-shell:
    # Validate the Nix dev shell so flake.lock / flake.nix changes (including the
    # weekly Dependabot bumps) are exercised through the Nix path. Dependabot PRs
    # trigger this automatically, so it is the validation gate for those bumps.
    # Grows naturally once `nix build` / the NixOS module lands (ADR-0006).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build and lint inside the dev shell
        run: |
          nix develop -c bash -c 'set -e; go version; go vet ./...; go build ./...; golangci-lint run ./...'

  codegen:
    # Enforce the reproducibility claim in ADR-0021: the committed
    # internal/openapi/openapi.gen.go must match what the pinned generator
    # produces from the committed api/openapi.yaml. Regenerating through
    # `nix develop` uses the flake-pinned oapi-codegen (ADR-0017), so a
    # non-empty diff means the generated file is stale or was hand-edited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Verify generated code is in sync with the spec
        run: |
          nix develop -c bash -c 'set -e; make openapi; git diff --exit-code internal/openapi/openapi.gen.go'

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build Docker image
        run: docker build -f deploy/docker/Dockerfile -t typist:${{ github.sha }} .

  govulncheck:
    # Idiomatic Go tool for checking for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: govulncheck
        run: nix develop -c govulncheck ./...
